name: ROOF OS CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: apps/field
      - run: node scripts/audit-field-deps.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://validation.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-only-key
          CAPOUT_API_KEY: validation-only-key
          RAPIDAPI_KEY: validation-only-key
          SUPABASE_SERVICE_ROLE_KEY: validation-only-key
          CRON_SECRET: validation-only-key
      - run: npm run typecheck
      - run: npm run release-check
      - run: npm run verify:security
      - run: npm run test:receptionist
      - run: npm run test:aerial
      - run: npm run test:crm-missing-spokes
      - run: npm run test:api-security
      - run: npm run test:auth-flow
      - run: npm run test:mobile-offline-sync
      - run: npm run test:agent-runtime
      - run: npm run test:inspection-quality-agent
      - run: npm run test:prototype-guardrails
      - run: npm run test:photo-estimate-flow
      - run: npm run test:siding-measurement
      - run: npm run test:siding-authority
      - run: npm run test:siding-ai-authority
      - run: npm run test:photo-full-report-flow
      - run: npm run test:measurement-estimate-authority
      - run: npm run test:ai-vision-contract
      - run: npm run test:ai-vision-endpoint
      - run: npm run audit

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/field
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/field/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo config --json > /tmp/expo-config.json

  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: apps/field
      - name: Build without deployment-only secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
        run: npm run build
      - run: npx tsc --noEmit

  refresh-field-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: apps/field
      - uses: actions/upload-artifact@v4
        with:
          name: field-package-lock
          path: apps/field/package-lock.json

  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration order and required policies
        shell: bash
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -ge 24
          grep -q "enable row level security" supabase/migrations/008_claims_line_items_agent_readiness.sql
          grep -q "enable row level security" supabase/migrations/009_agent_runtime_claims_imports.sql
          grep -q "monthly_limit" supabase/migrations/010_retailer_price_cache.sql
          grep -q "retailer_price_watchlist" supabase/migrations/011_weekly_retailer_refresh.sql
          grep -q "storm_evidence" supabase/migrations/012_inspection_measurements_storms.sql
          grep -q "drone_captures" supabase/migrations/013_drone_capture_evidence.sql
          grep -q "is_system_owner" supabase/migrations/014_system_owner_lock.sql
          grep -q "local_tax_rate" supabase/migrations/015_owner_price_book_local_tax.sql
          grep -q "agent_runs" supabase/migrations/016_align_agent_runs_runtime_contract.sql
          grep -q "workspace_invitations" supabase/migrations/017_team_invites_atomic_price_books.sql
          grep -q "save_owner_price_book" supabase/migrations/017_team_invites_atomic_price_books.sql
          grep -q "supplements" supabase/migrations/018_supplement_review_records.sql
          grep -q "material_catalog" supabase/migrations/019_material_catalog_workspace_settings.sql
          grep -q "agent_runs_workspace_agent_event_key" supabase/migrations/021_agent_runs_idempotency_contract.sql
          grep -q "photo_estimate_workflows" supabase/migrations/022_photo_estimate_workflows.sql
          grep -q "lowes" supabase/migrations/025_lowes_retailer_provider.sql
          grep -q "is_workspace_admin" supabase/migrations/026_supplement_review_admin_guard.sql
          grep -q "photo_estimate_workflows_update" supabase/migrations/027_photo_estimate_admin_guard.sql
          grep -q "photo_estimate_workflow_id" supabase/migrations/038_estimate_packet_photo_workflow_source.sql
          grep -q "next_action_owner_id" supabase/migrations/039_crm_missing_spokes.sql
          grep -q "lead_score" supabase/migrations/039_crm_missing_spokes.sql
          grep -q "aerial_measurements_workspace_consistency" supabase/migrations/041_aerial_workspace_consistency.sql
          grep -q "roof_planes_workspace_consistency" supabase/migrations/041_aerial_workspace_consistency.sql
          grep -q "manager_approval_signature" supabase/migrations/042_golden_report_review_controls.sql
          grep -q "is_valid_approved_photo_estimate_packet" supabase/migrations/038_estimate_packet_photo_workflow_source.sql
          grep -q "siding_measurements" supabase/migrations/044_siding_measurements.sql
          grep -q "ai_observation" supabase/migrations/045_siding_ai_observations.sql
          grep -q "verified_by" supabase/migrations/046_siding_measurement_verification.sql
          grep -q "is_valid_approved_siding_estimate_packet" supabase/migrations/047_siding_estimate_packet_authority.sql
          grep -q "siding_measurement_id" supabase/migrations/047_siding_estimate_packet_authority.sql
          grep -q "estimate_review_packets_insert_approved_workflow" supabase/migrations/038_estimate_packet_photo_workflow_source.sql
          grep -q "accept_workspace_invitation" supabase/migrations/028_invitation_acceptance_transaction.sql
          grep -q "query month must be the current UTC month" supabase/migrations/035_retailer_quota_hardening.sql
          grep -q "monthly limit is fixed at 100" supabase/migrations/035_retailer_quota_hardening.sql
          grep -q "drop policy if exists agent_runs_select" supabase/migrations/009_agent_runtime_claims_imports.sql
          grep -q "isCronPath" proxy.ts
          grep -q "safeNextPath" app/auth/callback/route.ts app/auth/login/page.tsx lib/safe-next.ts
          grep -q "Workspace administrator access is required" app/api/claims/capout/route.ts
          grep -q "signed URL for an authorized ROOF/OS inspection asset" app/api/claims/capout/route.ts
          test -f app/api/team/invitations/accept/route.ts
          test -f app/team/invitations/accept/page.tsx
          grep -q "accept_workspace_invitation" app/api/team/invitations/accept/route.ts
          if grep -RInE 'CAPOUT_API_KEY=|RAPIDAPI_KEY=|SUPABASE_SERVICE_ROLE_KEY=' --exclude=.env.example --exclude-dir=.git --exclude-dir=.github .; then exit 1; fi
