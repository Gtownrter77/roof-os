          grep -q "supplement_review_drafts_idempotency_idx" supabase/migrations/066_supplement_review_idempotency.sql
          grep -q "idempotency_key" supabase/migrations/066_supplement_review_idempotency.sql
          grep -q "production_job_assignments" supabase/migrations/067_production_job_schedule.sql
          grep -q "production_job_materials" supabase/migrations/067_production_job_schedule.sql
          grep -q "A production assignment cannot be deleted; cancel it instead" supabase/migrations/067_production_job_schedule.sql
          grep -q "A material line cannot be deleted; cancel it instead" supabase/migrations/067_production_job_schedule.sql
          grep -q "Invalid assignment status transition" supabase/migrations/067_production_job_schedule.sql
          grep -q "Invalid material status transition" supabase/migrations/067_production_job_schedule.sql
          grep -q "production_job_readiness" supabase/migrations/068_production_job_readiness.sql
          grep -q "A prebuild readiness record cannot be deleted; record a new decision instead" supabase/migrations/068_production_job_readiness.sql
          grep -q "The readiness job and workspace are immutable" supabase/migrations/068_production_job_readiness.sql
          grep -q "permit_checked_by" supabase/migrations/068_production_job_readiness.sql
          grep -q "weather_checked_at" supabase/migrations/068_production_job_readiness.sql
          grep -q "Never supplied by the browser" supabase/migrations/068_production_job_readiness.sql
          grep -q "create extension if not exists pgcrypto" supabase/migrations/053_agent_action_ledger.sql
          grep -q "approval hashes do not match the current action batch" supabase/migrations/053_agent_action_ledger.sql
          grep -q "get diagnostics updated_count = row_count" supabase/migrations/053_agent_action_ledger.sql
          grep -q "revoke all on function public.approve_agent_action_batch" supabase/migrations/053_agent_action_ledger.sql
          grep -q "set search_path = public" supabase/migrations/053_agent_action_ledger.sql
          grep -q "inspection_verifications" supabase/migrations/050_mobile_technician_verification.sql
          grep -q "rafter_lf" supabase/migrations/052_mobile_field_measurement_inputs.sql
          grep -q "soffit_lf" supabase/migrations/052_mobile_field_measurement_inputs.sql
          grep -q "fascia_lf" supabase/migrations/052_mobile_field_measurement_inputs.sql
          grep -q "roof_type" supabase/migrations/052_mobile_field_measurement_inputs.sql
          grep -q "isCronPath" proxy.ts
          grep -q "safeNextPath" app/auth/callback/route.ts app/auth/login/page.tsx lib/safe-next.ts
          grep -q "Workspace administrator access is required" app/api/claims/capout/route.ts
          grep -q "signed URL for an authorized ROOF/OS inspection asset" app/api/claims/capout/route.ts
          test -f app/api/team/invitations/accept/route.ts
          test -f app/team/invitations/accept/page.tsx
          grep -q "accept_workspace_invitation" app/api/team/invitations/accept/route.ts
          if grep -RInE 'CAPOUT_API_KEY=|RAPIDAPI_KEY=|SUPABASE_SERVICE_ROLE_KEY=' --exclude=.env.example --exclude-dir=.git --exclude-dir=.github .; then exit 1; fi
      - name: Run real PostgreSQL estimate authority SQL/RLS tests
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: roofos_authority_ci
          PGUSER: postgres
          PGPASSWORD: ci-synthetic-only
        run: bash scripts/ci/verify-estimate-authority-postgres.sh
