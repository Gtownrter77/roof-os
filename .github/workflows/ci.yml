name: ROOF OS CI

permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: apps/field
      # Keep the security check in the required web job until main's ruleset requires field-security.
      - run: node scripts/test-field-deepmerge-mitigation.cjs
      - run: node scripts/audit-field-deps.mjs
      - run: node scripts/release-foreman-check.mjs
      - run: node --experimental-strip-types scripts/worker-heartbeat-runtime-test.mjs
      - run: npm run test:braces-mitigation --prefix apps/field
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://validation.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-only-key
          CAPOUT_API_KEY: validation-only-key
          RAPIDAPI_KEY: validation-only-key
          SUPABASE_SERVICE_ROLE_KEY: validation-only-key
          CRON_SECRET: validation-only-key
      - run: npm run test:runtime-smoke
      - run: npm run typecheck
      - run: npm run release-check
      - run: npm run verify:security
      - run: npm run test:security-definer-migrations
      - run: npm run test:receptionist
      - run: npm run test:aerial
      - run: npm run test:crm-missing-spokes
      - run: npm run test:api-security
      - run: npm run test:auth-flow
      - run: npm run test:invitation-flow
      - run: npm run test:two-workspace-contract
      - run: npm run test:mobile-offline-sync
      - run: npm run test:mobile-ai-observation-security
      - run: npm run test:mobile-auth
      - run: npm run test:worker-heartbeat
      - run: npm run test:release-evidence
      - run: npm run test:staging-workflows
      - run: npm run test:backup-evidence
      - run: npm run test:mobile-release-contract
      - run: npm run test:live-release-preflight
      - run: npm run test:authenticated-readonly-smoke
      - run: npm run test:heartbeat-probe
      - run: npm run test:field-device-evidence
      - run: npm run test:release-gate-summary
      - run: npm run test:field-coach
      - run: npm run test:stale-screens
      - run: npm run test:cinema-theme
      - run: npm run test:dashboard-skin
      - run: npm run test:agent-runtime
      - run: npm run test:agent-action-policy
      - run: npm run test:inspection-quality-agent
      - run: npm run test:prototype-guardrails
      - run: npm run test:photo-estimate-flow
      - run: npm run test:siding-measurement
      - run: npm run test:siding-authority
      - run: npm run test:siding-ai-authority
      - run: npm run test:payment-checkout
      - run: npm run test:status-health
      - run: npm run test:ai-report-authority
      - run: npm run test:ai-chat-bar
      - run: npm run test:invoices-live-data
      - run: npm run test:radar-source
      - run: npm run test:dashboard-weather
      - run: npm run test:owner-labor
      - run: npm run test:photo-full-report-flow
      - run: npm run test:measurement-estimate-authority
      - run: npm run test:estimate-approval-authority
      - run: npm run test:reliability
      - run: npm run test:agent5-supplement
      - run: npm run test:agent5-capout-study
      - run: npm run test:pdf-normalizer
      - run: npm run test:supplement-review-ui
      - run: npm run test:agent5-export-idempotency
      - run: npm run test:owner-break-glass
      - run: npm run test:lead-dedup
      - run: npm run test:inspection-appointment
      - run: npm run test:inspection-packet
      - run: npm run test:estimate-acceptance
      - run: npm run test:production-job
      - run: npm run test:production-job-schedule
      - run: npm run test:production-job-readiness
      - run: npm run test:ai-vision-contract
      - run: npm run test:ai-vision-endpoint
      - run: npm run test:workspace-settings
      - run: npm run audit

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/field
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/field/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo config --json > /tmp/expo-config.json

  field-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/field/package-lock.json
      - run: npm ci
        working-directory: apps/field
      - run: node scripts/test-field-deepmerge-mitigation.cjs
      - run: node scripts/audit-field-deps.mjs

  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: apps/field
      - name: Build without deployment-only secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
        run: npm run build
      - run: npx tsc --noEmit

  # This job pushes a refreshed lockfile, so never run it on pull_request events.
  # Fork PR branch names must not be resolved against and written to the base repository.
  refresh-field-lock:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh from branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git checkout -B "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" "origin/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: apps/field
      - name: Commit refreshed field lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/field/package-lock.json; then
            echo 'Field lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/field/package-lock.json
          git commit -m 'fix(field): refresh Expo dependency lockfile'
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}

  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roofos_authority_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roofos_authority_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - name: Check migration order and required policies
        shell: bash
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -ge 24
          grep -q "enable row level security" supabase/migrations/008_claims_line_items_agent_readiness.sql
          grep -q "enable row level security" supabase/migrations/009_agent_runtime_claims_imports.sql
          grep -q "monthly_limit" supabase/migrations/010_retailer_price_cache.sql
          grep -q "retailer_price_watchlist" supabase/migrations/011_weekly_retailer_refresh.sql
          grep -q "storm_evidence" supabase/migrations/012_inspection_measurements_storms.sql
          grep -q "drone_captures" supabase/migrations/013_drone_capture_evidence.sql
          grep -q "is_system_owner" supabase/migrations/014_system_owner_lock.sql
          grep -q "local_tax_rate" supabase/migrations/015_owner_price_book_local_tax.sql
          grep -q "agent_runs" supabase/migrations/016_align_agent_runs_runtime_contract.sql
          grep -q "workspace_invitations" supabase/migrations/017_team_invites_atomic_price_books.sql
          grep -q "save_owner_price_book" supabase/migrations/017_team_invites_atomic_price_books.sql
          grep -q "supplements" supabase/migrations/018_supplement_review_records.sql
          grep -q "material_catalog" supabase/migrations/019_material_catalog_workspace_settings.sql
          grep -q "agent_runs_workspace_agent_event_key" supabase/migrations/021_agent_runs_idempotency_contract.sql
          grep -q "photo_estimate_workflows" supabase/migrations/022_photo_estimate_workflows.sql
          grep -q "lowes" supabase/migrations/025_lowes_retailer_provider.sql
          grep -q "is_workspace_admin" supabase/migrations/026_supplement_review_admin_guard.sql
          grep -q "photo_estimate_workflows_update" supabase/migrations/027_photo_estimate_admin_guard.sql
          grep -q "photo_estimate_workflow_id" supabase/migrations/038_estimate_packet_photo_workflow_source.sql
          grep -q "next_action_owner_id" supabase/migrations/039_crm_missing_spokes.sql
          grep -q "manager_approval_signature" supabase/migrations/042_golden_report_review_controls.sql
          grep -q "lead_score" supabase/migrations/039_crm_missing_spokes.sql
          grep -q "aerial_measurements_workspace_consistency" supabase/migrations/041_aerial_workspace_consistency.sql
          grep -q "roof_planes_workspace_consistency" supabase/migrations/041_aerial_workspace_consistency.sql
          grep -q "manager_approval_signature" supabase/migrations/042_golden_report_review_controls.sql
          grep -q "is_valid_approved_photo_estimate_packet" supabase/migrations/038_estimate_packet_photo_workflow_source.sql
          grep -q "siding_measurements" supabase/migrations/044_siding_measurements.sql
          grep -q "ai_observation" supabase/migrations/045_siding_ai_observations.sql
          grep -q "verified_by" supabase/migrations/046_siding_measurement_verification.sql
          grep -q "is_valid_approved_siding_estimate_packet" supabase/migrations/047_siding_estimate_packet_authority.sql
          grep -q "siding_measurement_id" supabase/migrations/047_siding_estimate_packet_authority.sql
          grep -q "scale_reference_pixels" supabase/migrations/048_aerial_calibration_reference.sql
          grep -q "pixels_per_foot" supabase/migrations/048_aerial_calibration_reference.sql
          grep -q "estimate_review_packets_insert_approved_workflow" supabase/migrations/038_estimate_packet_photo_workflow_source.sql
          grep -q "accept_workspace_invitation" supabase/migrations/028_invitation_acceptance_transaction.sql
          grep -q "query month must be the current UTC month" supabase/migrations/035_retailer_quota_hardening.sql
          grep -q "monthly limit is fixed at 100" supabase/migrations/035_retailer_quota_hardening.sql
          grep -q "drop policy if exists agent_runs_select" supabase/migrations/009_agent_runtime_claims_imports.sql
          test -f supabase/migrations/050_mobile_technician_verification.sql
          test -f supabase/migrations/052_mobile_field_measurement_inputs.sql
          test -f supabase/migrations/054_mobile_ai_observations.sql
          test -f supabase/migrations/057_workspace_feature_flags.sql
          grep -q "enable_auto_followup_tasks" supabase/migrations/057_workspace_feature_flags.sql
          grep -q "enable_ai_receptionist" supabase/migrations/057_workspace_feature_flags.sql
          grep -q "receptionist_payment_links add column if not exists expires_at" supabase/migrations/057_workspace_feature_flags.sql
          grep -q "enable row level security" supabase/migrations/054_mobile_ai_observations.sql
          grep -q "AI observation provenance is immutable after insertion" supabase/migrations/054_mobile_ai_observations.sql
          grep -q "AI observation and inspection must belong to the same workspace" supabase/migrations/054_mobile_ai_observations.sql
          grep -q "public.is_workspace_admin(workspace_id)" supabase/migrations/054_mobile_ai_observations.sql
          test -f supabase/migrations/053_agent_action_ledger.sql
          grep -q "is_estimate_admin" supabase/migrations/059_estimate_approval_admin_guard.sql
          grep -q "An approved estimate is immutable" supabase/migrations/059_estimate_approval_admin_guard.sql
          grep -q "supplement_review_drafts" supabase/migrations/060_supplement_specialist_agent5.sql
          grep -q "enable row level security" supabase/migrations/060_supplement_specialist_agent5.sql
          grep -q "prevent_duplicate_lead" supabase/migrations/061_lead_deduplication.sql
          grep -q "lead_phone_digits" supabase/migrations/061_lead_deduplication.sql
          grep -q "enforce_inspection_appointment" supabase/migrations/062_inspection_appointment_gate.sql
          grep -q "An inspection must be assigned to a workspace member" supabase/migrations/062_inspection_appointment_gate.sql
          test -f app/api/inspections/\[id\]/packet/route.ts
          grep -q "urlsIncluded: false" lib/inspection/packet.ts
          grep -q "Agent 3 has not reviewed this inspection yet" app/inspections/\[id\]/page.tsx
          grep -q "estimate_acceptances" supabase/migrations/063_estimate_acceptance_deposit.sql
          grep -q "A recorded estimate acceptance is immutable" supabase/migrations/063_estimate_acceptance_deposit.sql
          grep -q "estimate_deposit_events" supabase/migrations/063_estimate_acceptance_deposit.sql
          grep -q "Not an electronic signature" supabase/migrations/063_estimate_acceptance_deposit.sql
          grep -q "v_refunded_count > 0" supabase/migrations/065_deposit_ledger_order.sql
          grep -q "never from UUID ordering" supabase/migrations/065_deposit_ledger_order.sql
