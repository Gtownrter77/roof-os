name: Refresh field dependency lock

on:
  # Only refresh the generated lockfile when its source manifest changes.
  # The full CI suite runs on pull_request and after merges to main.
  push:
    branches-ignore: [main]
    paths:
      - 'apps/field/package.json'

permissions:
  contents: write

concurrency:
  group: refresh-field-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-field-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh from branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: apps/field
      - name: Commit refreshed field lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/field/package-lock.json; then
            echo 'Field lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/field/package-lock.json
          git commit -m 'fix(field): refresh Expo dependency lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
