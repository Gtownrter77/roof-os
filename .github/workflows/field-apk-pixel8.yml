name: Field APK Pixel 8

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pixel8-field-apk-20261002
    paths:
      - .github/workflows/field-apk-pixel8.yml
      - apps/field/**

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install field app and generate Android project
        working-directory: apps/field
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Build arm64 debug APK
        working-directory: apps/field/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2

      - uses: actions/upload-artifact@v4
        with:
          name: roof-os-field-pixel8-arm64
          path: apps/field/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
