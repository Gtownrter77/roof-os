name: ROOF OS Free Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/free-evidence.yml
      - .github/workflows/ci.yml
      - package.json
      - supabase/**
      - scripts/ci/**
      - scripts/ci-*-test.mjs
      - docs/evidence/release-gates.json
  pull_request:
    paths:
      - .github/workflows/free-evidence.yml
      - .github/workflows/ci.yml
      - package.json
      - supabase/**
      - scripts/ci/**
      - scripts/ci-*-test.mjs
      - docs/evidence/release-gates.json

permissions:
  contents: read
  packages: write

jobs:
  free-evidence:
    name: Verify gates on free open-source stack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      CI_GATE_DIR: /tmp/roof-os-gates
      ROOF_RLS_TEST_NONPROD: 'true'
      ROOF_RLS_TEST_CONFIRM: I_UNDERSTAND_SYNTHETIC_DATA
      ROOF_RLS_USER_A_EMAIL: rls-a@roof-os.test
      ROOF_RLS_USER_A_PASSWORD: SyntheticPassA123!
      ROOF_RLS_USER_B_EMAIL: rls-b@roof-os.test
      ROOF_RLS_USER_B_PASSWORD: SyntheticPassB123!
      STAGING_PROJECT_REF: 127.0.0.1:54321
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install pinned open-source Supabase CLI
        run: |
          npm install --no-save --package-lock=false supabase@2.122.1
          npx supabase --version | grep -q '2.122.1'

      - name: Prepare collision-free local migration workdir
        run: |
          CI_SUPABASE_WORKDIR=/tmp/roof-os-supabase-ci
          node scripts/ci/prepare-local-migrations.mjs "$GITHUB_WORKSPACE" "$CI_SUPABASE_WORKDIR"
          echo "CI_SUPABASE_WORKDIR=$CI_SUPABASE_WORKDIR" >> "$GITHUB_ENV"

      - name: Start local Supabase and export endpoints
        run: |
          npx supabase start --workdir "$CI_SUPABASE_WORKDIR" --yes
          npx supabase status -o env --workdir "$CI_SUPABASE_WORKDIR" \
            --override-name api.url=SUPABASE_URL \
            --override-name api.anon_key=SUPABASE_ANON_KEY \
            --override-name api.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=DB_URL \
            | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Verify repository checks and CLI contract
        run: |
          cli_smoke="$(npx supabase db query --workdir "$CI_SUPABASE_WORKDIR" --local -o json 'select 1 as ok')"
          echo "$cli_smoke" | grep -q '"ok"'
          echo "$cli_smoke" | grep -q '1'
          npm run test:all
          mkdir -p "$CI_GATE_DIR"
          touch "$CI_GATE_DIR/repositoryChecks.pass"

      - name: Verify migration head and schema parity
        run: |
          head="$(psql "$DB_URL" -tAc "select max(version) from supabase_migrations.schema_migrations" | tr -d '\r')"
          echo "migration head: $head"
          test "$head" = "114"
          server_version="$(psql "$DB_URL" -tAc 'show server_version' | tr -d '\r')"
          echo "postgres: $server_version"
          test "${server_version%%.*}" = "17"
          echo "Local Supabase CLI v2.122.1 pins PostgreSQL 17; the repository's PG16 SQL authority path remains separate."
          psql "$DB_URL" -tAc "select version from supabase_migrations.schema_migrations order by version" \
            > /tmp/roof-os-applied-versions.txt
          npm run ci:check-schema-parity -- \
            /tmp/roof-os-supabase-ci/ci-migration-manifest.json \
            /tmp/roof-os-applied-versions.txt
          mkdir -p "$CI_GATE_DIR"
          touch "$CI_GATE_DIR/stagingMigration.pass"
          touch "$CI_GATE_DIR/schemaParity.pass"

      - name: Seed two synthetic non-production users
        run: node scripts/ci/local-supabase-seed.mjs

      - name: Resolve synthetic workspace id
        run: |
          workspace_id="$(psql "$DB_URL" -tAc "select w.id::text from public.workspaces w join public.workspace_members m on m.workspace_id = w.id join auth.users u on u.id = m.user_id where u.email = 'rls-a@roof-os.test' limit 1" | tr -d '\r')"
          test -n "$workspace_id"
          echo "ROOF_CI_WORKSPACE_ID=$workspace_id" >> "$GITHUB_ENV"

      - name: Verify two-workspace RLS isolation
        run: |
          npm run test:two-workspace-isolation
          mkdir -p "$CI_GATE_DIR"
          touch "$CI_GATE_DIR/stagingRls.pass"

      - name: Verify authenticated read-only smoke
        run: |
          node scripts/authenticated-readonly-smoke.mjs
          mkdir -p "$CI_GATE_DIR"
          touch "$CI_GATE_DIR/authenticatedReadOnly.pass"

      - name: Verify worker heartbeat against local Supabase
        run: |
          node --experimental-strip-types scripts/ci/local-heartbeat-check.mjs
          mkdir -p "$CI_GATE_DIR"
          touch "$CI_GATE_DIR/stagingHeartbeat.pass"
          touch "$CI_GATE_DIR/workerRuntime.pass"

      - name: Verify backup and restore rehearsal
        run: |
          npx supabase db dump --workdir "$CI_SUPABASE_WORKDIR" --local --schema public --file /tmp/roof-os-backup.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'drop database if exists roof_os_restore' -c 'create database roof_os_restore'
          restore_url="${DB_URL%/postgres}/roof_os_restore"
          psql "$restore_url" -v ON_ERROR_STOP=1 -f /tmp/roof-os-backup.sql
          npx supabase db query --db-url "$restore_url" -o csv \
            "select count(*)::text as tables from pg_tables where schemaname = 'public'" | tail -n 1 | grep -Eq '^[0-9]+$'
          mkdir -p "$CI_GATE_DIR"
          touch "$CI_GATE_DIR/backupRestore.pass"

      - name: Install and start local Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/roof-os-ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull llama3.2:1b
          ollama --version | tee /tmp/roof-os-ollama-version.txt

      - name: Start local Twilio mock
        run: |
          nohup node scripts/ci/twilio-mock.mjs > /tmp/roof-os-twilio-mock.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -X POST -d 'To=%2B15550000001&From=%2B15550000002&Body=probe' http://127.0.0.1:6060/2010-04-01/Accounts/ACtest/Messages.json >/dev/null 2>&1 && break; sleep 1; done

      - name: Verify local provider execution paths
        env:
          OLLAMA_URL: http://127.0.0.1:11434
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '54325'
          TWILIO_MOCK_URL: http://127.0.0.1:6060/2010-04-01/Accounts/ACtest/Messages.json
        run: |
          node scripts/ci/local-provider-check.mjs
          mkdir -p "$CI_GATE_DIR"
          touch "$CI_GATE_DIR/providerExecution.pass"

      - name: Publish container to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}:ci-${{ github.sha }}"
          docker build -t "$image" .
          docker push "$image"
          docker inspect --format='{{index .RepoDigests 0}}' "$image" | tee /tmp/roof-os-ghcr-digest.txt

      - name: Generate and verify release evidence
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          npm run ci:collect-gates -- \
            --markers "$CI_GATE_DIR" \
            --output /tmp/roof-os-evidence-input.json \
            --run-id "$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA"
          npm run ci:write-evidence -- \
            /tmp/roof-os-evidence-input.json \
            docs/evidence/release-gates.json \
            docs/evidence/release-gates.provenance.json
          git status --short -- docs/evidence || true
          npm run test:release-gate-summary

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-evidence-${{ github.sha }}
          path: |
            docs/evidence/release-gates.json
            docs/evidence/release-gates.provenance.json
            /tmp/roof-os-ghcr-digest.txt
            /tmp/roof-os-applied-versions.txt
            /tmp/roof-os-ollama-version.txt
            /tmp/roof-os-supabase-ci/ci-migration-manifest.json
          if-no-files-found: warn

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --workdir "$CI_SUPABASE_WORKDIR" || true
