name: ROOF OS Mobile APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build-preview-apk:
    name: Build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/field
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/field/package-lock.json

      - name: Install field dependencies
        run: npm ci

      - name: Compile the field app
        run: npx tsc --noEmit

      - name: Validate Expo configuration
        run: npx expo config --json > /tmp/expo-config.json

      - name: Build Android APK with EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download the completed APK
        run: |
          mkdir -p ../../artifacts
          BUILD_ID="$(npx eas-cli@latest build:list --platform android --status finished --build-profile preview --git-commit-hash "${GITHUB_SHA}" --limit 1 --json --non-interactive | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => { const rows = JSON.parse(s); if (!rows[0]?.id) process.exit(1); process.stdout.write(rows[0].id) })")"
          test -n "$BUILD_ID"
          npx eas-cli@latest build:download --build-id "$BUILD_ID" --non-interactive
          APK="$(find . -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mv "$APK" ../../artifacts/roof-os-field-preview.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roof-os-field-preview-apk
          path: artifacts/roof-os-field-preview.apk
          if-no-files-found: error
          retention-days: 14
